name: Department Base
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: department-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  department-base:
    name: Department Base
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate contracts and security boundaries
        run: node --test .department/tests/department.test.mjs
      - name: Validate registered tasks
        run: node .department/cli.mjs validate
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
